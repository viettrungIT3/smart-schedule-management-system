name: CI

on:
  pull_request:
    branches: [ master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: scheduleflow
          MYSQL_USER: ssms
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h localhost -ussms || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, pdo_mysql, mysqli, zip, gd
      - name: Show PHP version
        run: php -v
      - name: Check secrets
        run: |
          echo "Checking if required secrets are set..."
          if [ -z "${{ secrets.CI_DB_PASSWORD }}" ]; then
            echo "ERROR: CI_DB_PASSWORD secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.CI_DB_ROOT_PASSWORD }}" ]; then
            echo "ERROR: CI_DB_ROOT_PASSWORD secret is not set"
            exit 1
          fi
          echo "All required secrets are set"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client unzip
      - name: Composer install (if composer.json exists)
        working-directory: src
        run: |
          if [ -f composer.json ]; then
            php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
            php composer-setup.php --install-dir=/usr/local/bin --filename=composer
            composer install --no-interaction --no-progress
          fi
      - name: Prepare CI4
        working-directory: src
        env:
          DB_PASS: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          cp -f env .env || cp -f env.example .env
          sed -i "s/^# app\.baseURL.*/app.baseURL = \"http:\/\/localhost:8080\"/" .env || true
          sed -i "s/^app\.baseURL.*/app.baseURL = \"http:\/\/localhost:8080\"/" .env || true
          sed -i "s/^database\.default\.hostname.*/database.default.hostname = 127.0.0.1/" .env || echo "database.default.hostname = 127.0.0.1" >> .env
          sed -i "s/^database\.default\.port.*/database.default.port = 3306/" .env || echo "database.default.port = 3306" >> .env
          sed -i "s/^database\.default\.database.*/database.default.database = scheduleflow/" .env || echo "database.default.database = scheduleflow" >> .env
          sed -i "s/^database\.default\.username.*/database.default.username = ssms/" .env || echo "database.default.username = ssms" >> .env
          sed -i "s/^database\.default\.password.*/database.default.password = ${DB_PASS}/" .env || echo "database.default.password = ${DB_PASS}" >> .env
          sed -i "s/^database\.default\.DBDriver.*/database.default.DBDriver = MySQLi/" .env || echo "database.default.DBDriver = MySQLi" >> .env
          sed -i "s/^database\.default\.DBPort.*/database.default.DBPort = 3306/" .env || echo "database.default.DBPort = 3306" >> .env
          php spark key:generate
      - name: Wait for MySQL
        env:
          MYSQL_PWD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          echo "Waiting for MySQL to be ready..."
          for i in {1..60}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -ussms --silent; then
              echo "MySQL is ready!"; break; 
            fi; 
            echo "Attempt $i/60: MySQL not ready yet, waiting..."; 
            sleep 2; 
          done
          # Final check
          if ! mysqladmin ping -h 127.0.0.1 -P 3306 -ussms --silent; then
            echo "MySQL failed to start after 2 minutes"
            exit 1
          fi
      - name: Migrate & Seed
        working-directory: src
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          echo "Testing database connection..."
          php -r "
            try {
              \$pdo = new PDO('mysql:host=127.0.0.1;port=3306;dbname=scheduleflow', 'ssms', getenv('CI_DB_PASSWORD'));
              echo 'Database connection successful\n';
            } catch (Exception \$e) {
              echo 'Database connection failed: ' . \$e->getMessage() . '\n';
              exit(1);
            }
          "
          echo "Checking .env configuration..."
          cat .env | grep -E "(database\.default\.|DB_)" || echo "No database config found in .env"
          echo "Testing CodeIgniter database connection..."
          php -r "
            require_once 'app/Config/Database.php';
            \$config = new \App\Config\Database();
            echo 'Hostname: ' . \$config->default['hostname'] . '\n';
            echo 'Port: ' . \$config->default['port'] . '\n';
            echo 'Database: ' . \$config->default['database'] . '\n';
            echo 'Username: ' . \$config->default['username'] . '\n';
            echo 'Driver: ' . \$config->default['DBDriver'] . '\n';
          "
          echo "Running migrations..."
          php spark migrate
          echo "Running seeders..."
          php spark db:seed DevSeeder
      - name: Smoke test
        working-directory: src
        run: |
          php -r "echo 'OK';"


